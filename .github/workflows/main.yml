name: Build DualAudioNew APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DualAudioNew_AndroidStudio_Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -o DualAudioNew_AndroidStudio_Project.zip -d project
          find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build Android APK
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          find "$ROOT" -maxdepth 3 -type f | head -100

          cd "$ROOT"

          if [ -f app/build.gradle.kts ] || [ -f app/build.gradle ]; then
            if [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew :app:assembleDebug
            else
              sudo apt-get update
              sudo apt-get install -y gradle
              gradle :app:assembleDebug
            fi
          else
            echo "ERROR: Android app module not found."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DualAudioNew-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
