name: Build DualAudioNew APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o DualAudioNew_AndroidStudio_Project.zip -d project
          ls -la project/DualAudioNew
          ls -la project/DualAudioNew/app

      - name: Install Gradle
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd project/DualAudioNew
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudioNew-APK
          path: project/DualAudioNew/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
