name: Build Dual Audio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o DualAudioNew_AndroidStudio_Project.zip -d project
          find project -type f -name gradlew -exec chmod +x {} \;

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          PROJECT_DIR=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -printf '%h\n' | head -n 1)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DualAudio-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
